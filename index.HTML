<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QEL 3D Periodic Table </title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            user-select: none;
        }

        body {
            background-color: #0d1117;
            color: #f0f6fc;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }

        
        #header-bar {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            padding: 12px 20px;
            background: rgba(13, 17, 23, 0.9);
            border-bottom: 2px solid #30363d;
            backdrop-filter: blur(10px);
            z-index: 20;
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }

        .brand-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .brand-title h1 {
            font-size: 1.5rem;
            font-weight: 800;
            background: linear-gradient(135deg, #58a6ff, #bc8cff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 0.5px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-box input {
            padding: 8px 16px;
            border-radius: 20px;
            border: 2px solid #30363d;
            background: #161b22;
            color: #f0f6fc;
            outline: none;
            width: 280px;
            font-size: 0.9rem;
            transition: all 0.25s ease;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .search-box input:focus {
            border-color: #58a6ff;
            box-shadow: 0 0 10px rgba(88, 166, 255, 0.4);
            width: 320px;
        }

        
        #filter-bar {
            position: absolute;
            top: 65px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 15;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 6px;
            max-width: 96vw;
            padding: 8px 14px;
            background: rgba(22, 27, 34, 0.85);
            backdrop-filter: blur(8px);
            border: 1px solid #30363d;
            border-radius: 25px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.4);
        }

        .filter-btn {
            background: #21262d;
            border: 1.5px solid #30363d;
            color: #c9d1d9;
            padding: 5px 12px;
            border-radius: 14px;
            cursor: pointer;
            font-size: 0.75rem;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        .filter-btn:hover {
            transform: translateY(-2px);
            color: #ffffff;
            border-color: #8b949e;
        }

        .filter-btn.active {
            color: #ffffff;
            border-color: #ffffff;
            box-shadow: 0 0 12px currentColor;
        }

        
        #layout-bar {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            display: flex;
            gap: 10px;
            background: rgba(22, 27, 34, 0.9);
            padding: 8px 16px;
            border-radius: 30px;
            border: 2px solid #30363d;
            box-shadow: 0 8px 25px rgba(0,0,0,0.6);
        }

        .layout-btn {
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            padding: 8px 20px;
            border-radius: 20px;
            cursor: pointer;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 0.5px;
            transition: all 0.25s ease;
        }

        .layout-btn:hover {
            color: #f0f6fc;
            background: #30363d;
        }

        .layout-btn.active {
            background: #238636;
            color: #ffffff;
            border-color: #2ea043;
            box-shadow: 0 0 10px rgba(46, 160, 67, 0.5);
        }

        
        #canvas-container {
            width: 100vw;
            height: 100vh;
            display: block;
        }

        
        #tooltip {
            position: absolute;
            padding: 8px 14px;
            background: rgba(22, 27, 34, 0.95);
            border: 2px solid #58a6ff;
            color: #ffffff;
            border-radius: 8px;
            font-size: 0.82rem;
            pointer-events: none;
            display: none;
            z-index: 50;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }

        
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.8);
            backdrop-filter: blur(10px);
            z-index: 100;
            display: none;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-card {
            background: #161b22;
            border: 2px solid #30363d;
            border-radius: 20px;
            width: 92%;
            max-width: 900px;
            max-height: 90vh;
            overflow-y: auto;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            position: relative;
            animation: modalPop 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes modalPop {
            from { transform: scale(0.85); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        .close-btn {
            position: absolute;
            top: 15px;
            right: 20px;
            background: #21262d;
            border: 1px solid #30363d;
            color: #8b949e;
            border-radius: 50%;
            width: 36px;
            height: 36px;
            font-size: 1.2rem;
            cursor: pointer;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }

        .close-btn:hover {
            color: #ffffff;
            background: #da3633;
            border-color: #f85149;
        }

        .modal-content {
            display: grid;
            grid-template-columns: 1fr 1.1fr;
            gap: 20px;
            padding: 25px;
        }

        @media (max-width: 820px) {
            .modal-content { grid-template-columns: 1fr; }
            #filter-bar { display: none; }
        }

        
        .atom-container {
            background: #0d1117;
            border: 1px solid #30363d;
            border-radius: 16px;
            padding: 15px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
        }

        #bohr-canvas {
            width: 100%;
            height: 300px;
            border-radius: 12px;
            background: #0d1117;
        }

        .speed-control {
            width: 100%;
            margin-top: 12px;
            background: #161b22;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #30363d;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.85rem;
            color: #8b949e;
        }

        .speed-control input[type=range] {
            flex: 1;
            accent-color: #58a6ff;
            cursor: pointer;
        }

        
        .element-details {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .element-title-header {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .element-title-header h2 {
            font-size: 2.2rem;
            font-weight: 800;
            color: #f0f6fc;
        }

        .category-badge {
            padding: 4px 12px;
            border-radius: 12px;
            font-size: 0.8rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .info-card {
            background: #21262d;
            padding: 10px 14px;
            border-radius: 10px;
            border: 1px solid #30363d;
        }

        .info-label {
            font-size: 0.72rem;
            color: #8b949e;
            text-transform: uppercase;
            font-weight: 700;
            display: block;
            margin-bottom: 2px;
        }

        .info-value {
            font-size: 0.95rem;
            font-weight: 600;
            color: #c9d1d9;
        }

        .element-desc {
            background: #21262d;
            padding: 12px 14px;
            border-radius: 10px;
            border: 1px solid #30363d;
            font-size: 0.85rem;
            line-height: 1.45;
            color: #8b949e;
            max-height: 120px;
            overflow-y: auto;
        }
    </style>

    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tween.js/18.6.4/tween.umd.js"></script>
</head>
<body>

    
    <div id="header-bar">
        <div class="brand-title">
            <h1>3D Periodic Table</h1>
        </div>
        <div class="search-box">
            <input type="text" id="search-input" placeholder="Search name, symbol, or number..." oninput="filterElements()">
        </div>
    </div>

    
    <div id="filter-bar">
        <button class="filter-btn active" style="color:#ffffff;" onclick="selectCategory('all', this)">All</button>
        <button class="filter-btn" style="color:#ff4d4d;" onclick="selectCategory('alkali-metal', this)">Alkali Metals</button>
        <button class="filter-btn" style="color:#ffa64d;" onclick="selectCategory('alkaline-earth-metal', this)">Alkaline Earth</button>
        <button class="filter-btn" style="color:#ffff4d;" onclick="selectCategory('transition-metal', this)">Transition Metals</button>
        <button class="filter-btn" style="color:#4dff88;" onclick="selectCategory('post-transition-metal', this)">Post-Transition</button>
        <button class="filter-btn" style="color:#4dffff;" onclick="selectCategory('metalloid', this)">Metalloids</button>
        <button class="filter-btn" style="color:#4d94ff;" onclick="selectCategory('reactive-nonmetal', this)">Reactive Nonmetals</button>
        <button class="filter-btn" style="color:#b366ff;" onclick="selectCategory('noble-gas', this)">Noble Gases</button>
        <button class="filter-btn" style="color:#ff66cc;" onclick="selectCategory('lanthanide', this)">Lanthanides</button>
        <button class="filter-btn" style="color:#ff4d94;" onclick="selectCategory('actinide', this)">Actinides</button>
    </div>

    
    <div id="canvas-container"></div>

    
    <div id="layout-bar">
        <button class="layout-btn active" id="btn-grid" onclick="switchLayout('grid')">GRID</button>
        <button class="layout-btn" id="btn-sphere" onclick="switchLayout('sphere')">SPHERE</button>
        <button class="layout-btn" id="btn-helix" onclick="switchLayout('helix')">HELIX</button>
    </div>

    
    <div id="tooltip"></div>

    
    <div class="modal-overlay" id="element-modal">
        <div class="modal-card">
            <button class="close-btn" onclick="closeModal()">&times;</button>
            <div class="modal-content">
                
                <div class="atom-container">
                    <canvas id="bohr-canvas"></canvas>
                    <div class="speed-control">
                        <span>Orbit Speed:</span>
                        <input type="range" id="speed-slider" min="0" max="3" step="0.1" value="1" oninput="updateOrbitSpeed(this.value)">
                        <span id="speed-val" style="color:#f0f6fc; font-weight:bold;">1.0x</span>
                    </div>
                </div>

                
                <div class="element-details">
                    <div class="element-title-header">
                        <h2 id="modal-name">Hydrogen</h2>
                        <span class="category-badge" id="modal-category">Nonmetal</span>
                    </div>
                    
                    <div class="info-grid">
                        <div class="info-card">
                            <span class="info-label">Atomic Number</span>
                            <span class="info-value" id="modal-number">1</span>
                        </div>
                        <div class="info-card">
                            <span class="info-label">Symbol</span>
                            <span class="info-value" id="modal-symbol">H</span>
                        </div>
                        <div class="info-card">
                            <span class="info-label">Atomic Mass</span>
                            <span class="info-value" id="modal-mass">1.008 u</span>
                        </div>
                        <div class="info-card">
                            <span class="info-label">Phase at STP</span>
                            <span class="info-value" id="modal-phase">Gas</span>
                        </div>
                        <div class="info-card" style="grid-column: span 2;">
                            <span class="info-label">Electron Shells</span>
                            <span class="info-value" id="modal-shells">1</span>
                        </div>
                        <div class="info-card" style="grid-column: span 2;">
                            <span class="info-label">Discovered By</span>
                            <span class="info-value" id="modal-discovered">Henry Cavendish (1766)</span>
                        </div>
                    </div>

                    <div class="element-desc" id="modal-desc">
                        Hydrogen is the lightest chemical element in the periodic table with atomic number 1.
                    </div>
                </div>
            </div>
        </div>
    </div>

        function createTileTexture(element) {
            const canvas = document.createElement('canvas');
            canvas.width = 256;
            canvas.height = 256;
            const ctx = canvas.getContext('2d');

            
            ctx.fillStyle = '#161b22';
            ctx.beginPath();
            ctx.roundRect(8, 8, 240, 240, 18);
            ctx.fill();

            
            const colorHex = '#' + (categoryColors[element.category] || 0x8b949e).toString(16).padStart(6, '0');
            ctx.strokeStyle = colorHex;
            ctx.lineWidth = 10;
            ctx.stroke();

            
            ctx.fillStyle = '#8b949e';
            ctx.font = 'bold 28px "Segoe UI", sans-serif';
            ctx.fillText(element.number, 24, 48);

            
            ctx.fillStyle = '#ffffff';
            ctx.font = 'bold 84px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(element.symbol, 128, 136);

            
            ctx.fillStyle = '#c9d1d9';
            ctx.font = 'bold 22px "Segoe UI", sans-serif';
            ctx.fillText(element.name, 128, 182);

            
            ctx.fillStyle = '#8b949e';
            ctx.font = '18px "Segoe UI", sans-serif';
            ctx.fillText(element.mass, 128, 218);

            return new THREE.CanvasTexture(canvas);
        }

        function createElementTiles() {
            const geometry = new THREE.BoxGeometry(64, 64, 8);

            elements.forEach((element) => {
                const texture = createTileTexture(element);
                const material = new THREE.MeshStandardMaterial({
                    map: texture,
                    roughness: 0.2,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 1
                });

                const mesh = new THREE.Mesh(geometry, material);
                mesh.userData = { element: element };
                scene.add(mesh);
                elementObjects.push(mesh);
            });
        }

        

        function calculateLayouts() {
            const count = elementObjects.length;

            
            elements.forEach((el) => {
                const object = new THREE.Object3D();
                object.position.x = (el.gridCol * 76) - 720;
                object.position.y = -(el.gridRow * 76) + 400;
                object.position.z = 0;
                layoutPositions.grid.push(object);
            });

            
            for (let i = 0; i < count; i++) {
                const phi = Math.acos(-1 + (2 * i) / count);
                const theta = Math.sqrt(count * Math.PI) * phi;
                const radius = 480;

                const object = new THREE.Object3D();
                object.position.setFromSphericalCoords(radius, phi, theta);

                // Point outwards from sphere center
                const lookTarget = object.position.clone().multiplyScalar(2);
                object.lookAt(lookTarget);

                layoutPositions.sphere.push(object);
            }

            
            for (let i = 0; i < count; i++) {
                const phi = i * 0.35 + Math.PI;
                const radius = 500;

                const object = new THREE.Object3D();
                object.position.x = radius * Math.sin(phi);
                object.position.y = -(i * 9) + 450;
                object.position.z = radius * Math.cos(phi);

                
                const lookTarget = object.position.clone();
                lookTarget.x *= 2;
                lookTarget.z *= 2;
                object.lookAt(lookTarget);

                layoutPositions.helix.push(object);
            }
        }

        function applyLayout(layoutType, duration = 1000) {
            const targetPositions = layoutPositions[layoutType];

            for (let i = 0; i < elementObjects.length; i++) {
                const mesh = elementObjects[i];
                const target = targetPositions[i];

                
                new TWEEN.Tween(mesh.position)
                    .to({ x: target.position.x, y: target.position.y, z: target.position.z }, duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();

                
                new TWEEN.Tween(mesh.rotation)
                    .to({ x: target.rotation.x, y: target.rotation.y, z: target.rotation.z }, duration)
                    .easing(TWEEN.Easing.Exponential.InOut)
                    .start();
            }
        }

        function switchLayout(layoutName) {
            document.querySelectorAll('.layout-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById(`btn-${layoutName}`).classList.add('active');

            applyLayout(layoutName, 1200);
        }

            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));

            activeCategory = category;

        function filterElements() {
            searchQuery = document.getElementById('search-input').value.toLowerCase().trim();
            applyFilters();
        }

        function applyFilters() {
            elementObjects.forEach(mesh => {
                const el = mesh.userData.element;

                const matchesCategory = (activeCategory === 'all' || el.category === activeCategory);
                const matchesSearch = (
                    el.name.toLowerCase().includes(searchQuery) ||
                    el.symbol.toLowerCase().includes(searchQuery) ||
                    el.number.toString().includes(searchQuery)
                );

                const isVisible = matchesCategory && matchesSearch;

                new TWEEN.Tween(mesh.material)
                    .to({ opacity: isVisible ? 1.0 : 0.12 }, 400)
                    .start();
            });
        }

       

        const tooltip = document.getElementById('tooltip');

        function onMouseMove(event) {
            mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(elementObjects);

            if (intersects.length > 0) {
                const hoveredMesh = intersects[0].object;
                const el = hoveredMesh.userData.element;

                tooltip.style.display = 'block';
                tooltip.style.left = (event.clientX + 14) + 'px';
                tooltip.style.top = (event.clientY + 14) + 'px';
                tooltip.innerHTML = `<strong>${el.name} (${el.symbol})</strong><br>Atomic #${el.number} • ${el.mass} u`;
                document.body.style.cursor = 'pointer';
            } else {
                tooltip.style.display = 'none';
                document.body.style.cursor = 'default';
            }
        }

        function onTileClick(event) {
            if (event.clientY < 110 || event.clientY > window.innerHeight - 80) return;

            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(elementObjects);

            if (intersects.length > 0) {
                const selectedElement = intersects[0].object.userData.element;
                openModal(selectedElement);
            }
        }

        function initBohrScene() {
            const canvas = document.getElementById('bohr-canvas');

            bohrScene = new THREE.Scene();
            bohrScene.background = new THREE.Color(0x0d1117);

            bohrCamera = new THREE.PerspectiveCamera(45, canvas.clientWidth / canvas.clientHeight, 0.1, 1000);
            bohrCamera.position.set(0, 32, 75);
            bohrCamera.lookAt(0, 0, 0);

            bohrRenderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true });

        function buildBohrAtom(element) {
            
            while (bohrScene.children.length > 0) {
                bohrScene.remove(bohrScene.children[0]);
            }
            bohrElectrons = [];

            
            const ambLight = new THREE.AmbientLight(0xffffff, 0.8);
            bohrScene.add(ambLight);

            const pointLight = new THREE.PointLight(0x58a6ff, 1.2, 100);
            pointLight.position.set(10, 20, 25);
            bohrScene.add(pointLight);

            
            const nucleusGroup = new THREE.Group();
            const protonCount = Math.min(element.number, 32);
            const neutronCount = protonCount;

            const sphereGeo = new THREE.SphereGeometry(0.85, 16, 16);
            const protonMat = new THREE.MeshStandardMaterial({ color: 0xf85149, roughness: 0.2 }); // Red Protons
            const neutronMat = new THREE.MeshStandardMaterial({ color: 0x8b949e, roughness: 0.2 }); // Grey Neutrons

            for (let i = 0; i < protonCount + neutronCount; i++) {
                const isProton = i % 2 === 0;
                const particle = new THREE.Mesh(sphereGeo, isProton ? protonMat : neutronMat);

                particle.position.set(
                    (Math.random() - 0.5) * 4.0,
                    (Math.random() - 0.5) * 4.0,
                    (Math.random() - 0.5) * 4.0
                );
                nucleusGroup.add(particle);
            }
            bohrScene.add(nucleusGroup);

            
            const shellRadii = [8, 14, 20, 26, 32, 38, 44];

            element.shells.forEach((electronCount, shellIndex) => {
                const radius = shellRadii[shellIndex] || (8 + shellIndex * 6);

                
                const orbitGeo = new THREE.BufferGeometry();
                const points = [];
                const segments = 64;
                for (let j = 0; j <= segments; j++) {
                    const theta = (j / segments) * Math.PI * 2;
                    points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
                }
                orbitGeo.setFromPoints(points);
                const orbitMat = new THREE.LineBasicMaterial({ color: 0x30363d, transparent: true, opacity: 0.8 });
                const orbitLine = new THREE.Line(orbitGeo, orbitMat);

                orbitLine.rotation.x = (Math.PI / 6) * shellIndex;
                orbitLine.rotation.z = (Math.PI / 8) * shellIndex;
                bohrScene.add(orbitLine);

                
                const electronGeo = new THREE.SphereGeometry(0.55, 12, 12);
                const electronMat = new THREE.MeshStandardMaterial({
                    color: 0x58a6ff,
                    emissive: 0x1f6feb,
                    emissiveIntensity: 0.5
                });

                for (let e = 0; e < electronCount; e++) {
                    const electronMesh = new THREE.Mesh(electronGeo, electronMat);
                    const baseAngle = (e / electronCount) * Math.PI * 2;

                    bohrScene.add(electronMesh);
                    bohrElectrons.push({
                        mesh: electronMesh,
                        radius: radius,
                        angle: baseAngle,
                        rotX: orbitLine.rotation.x,
                        rotZ: orbitLine.rotation.z,
                        speed: (0.025 + (0.004 * (shellIndex + 1)))
                    });
                }
            });
        }

        function animateBohrAtom() {
            bohrAnimationId = requestAnimationFrame(animateBohrAtom);

            bohrElectrons.forEach(e => {
                e.angle += e.speed * orbitSpeed;

                const x = Math.cos(e.angle) * e.radius;
                const z = Math.sin(e.angle) * e.radius;

                const pos = new THREE.Vector3(x, 0, z);
                pos.applyAxisAngle(new THREE.Vector3(1, 0, 0), e.rotX);
                pos.applyAxisAngle(new THREE.Vector3(0, 0, 1), e.rotZ);

                e.mesh.position.copy(pos);
            });

            bohrRenderer.render(bohrScene, bohrCamera);
        }

        function updateOrbitSpeed(val) {
            orbitSpeed = parseFloat(val);
            document.getElementById('speed-val').innerText = orbitSpeed.toFixed(1) + 'x';
        }

        

        function openModal(element) {
            document.getElementById('modal-name').innerText = element.name;
            document.getElementById('modal-symbol').innerText = element.symbol;
            document.getElementById('modal-number').innerText = element.number;
            document.getElementById('modal-mass').innerText = element.mass + ' u';
            document.getElementById('modal-category').innerText = element.category.replace(/-/g, ' ');
            document.getElementById('modal-phase').innerText = element.phase;
            document.getElementById('modal-shells').innerText = element.shells.join(', ');
            document.getElementById('modal-discovered').innerText = element.discovered;
            document.getElementById('modal-desc').innerText = element.desc;

           
            const badge = document.getElementById('modal-category');
            const colorHex = '#' + (categoryColors[element.category] || 0x30363d).toString(16).padStart(6, '0');
            badge.style.backgroundColor = colorHex;
            badge.style.color = '#ffffff';

            const modal = document.getElementById('element-modal');
            modal.classList.add('show');

            if (!bohrRenderer) {
                initBohrScene();
            }

            buildBohrAtom(element);

            if (bohrAnimationId) cancelAnimationFrame(bohrAnimationId);
            animateBohrAtom();
        }

        function closeModal() {
            const modal = document.getElementById('element-modal');
            modal.classList.remove('show');

            if (bohrAnimationId) {
                cancelAnimationFrame(bohrAnimationId);
            }
        }

        function onWindowResize() {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        }

        function animate() {
            requestAnimationFrame(animate);

            TWEEN.update();
            controls.update();

            renderer.render(scene, camera);
        }

        
        window.onload = () => {
            initMainScene();
        };
    </script>
</body>
</html>
